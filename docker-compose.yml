services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 940927syz
      MYSQL_DATABASE: logtool
      MYSQL_USER: logtool
      MYSQL_PASSWORD: 940927syz
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./infrastructure/database/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306" # 调试/内网需要时开放；生产可移除
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379" # 调试/内网需要时开放；生产可移除
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: 940927syz
      CLICKHOUSE_DB: logtool
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./infrastructure/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./infrastructure/clickhouse/users.d:/etc/clickhouse-server/users.d
      - ./infrastructure/database/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # Native
    # 增加内存限制，避免合并操作时内存不足
    cpus: "1.0"
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: logtool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 940927syz
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infrastructure/database/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432" # 调试/内网需要时开放；生产可移除
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: logtool
      MONGO_INITDB_ROOT_PASSWORD: 940927syz
      MONGO_INITDB_DATABASE: logtool
    volumes:
      - ./data/mongodb:/data/db
    ports:
      - "27017:27017" # 调试/内网需要时开放；生产可移除
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
  elasticsearch:
    build:
      context: ./infrastructure/elasticsearch
      dockerfile: Dockerfile
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=940927syz
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  esdata:
