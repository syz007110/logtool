name: logtool-test

services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: logtool_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: admin123
      MYSQL_ROOT_PASSWORD: admin123
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utest_user", "-padmin123"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
